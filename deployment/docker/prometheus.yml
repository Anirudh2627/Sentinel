# Prometheus scrape configuration for the local Sentinel stack.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sentinel-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: sentinel-serving

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
